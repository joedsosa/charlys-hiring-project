<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard</title>
  <link rel="icon" href="assets/img/favicon.svg?v=4" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css?v=4">
  <script>
    try { var t = localStorage.getItem('hireflow-theme') || 'dark'; document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body data-page="admin" data-title="Admin dashboard">
  <main class="container">
    <div class="page-head">
      <h1>Recruiting dashboard</h1>
      <p>New applicants get reviewed and scored the moment they apply. Read the summary, listen to what they said and decide who moves forward.</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="overview" aria-selected="true">Overview</button>
      <button class="tab" role="tab" data-view="pipeline" aria-selected="false">Board <span class="count" id="new-count">0</span></button>
    </div>

    <section id="view-overview"></section>

    <section id="view-pipeline" class="hidden">
      <div class="filters filters-2">
        <input type="search" id="k-search" placeholder="Search candidates" aria-label="Search candidates">
        <select id="k-position" aria-label="Position"><option value="">All positions</option></select>
      </div>
      <div class="kanban" id="kanban"></div>
      <p class="small muted">Tip: drag cards between columns, or open someone to move them along.</p>
    </section>
  </main>

  <script src="assets/js/config.js?v=4"></script>
  <script src="assets/js/data.js?v=4"></script>
  <script src="assets/js/ai.js?v=4"></script>
  <script src="assets/js/store.js?v=4"></script>
  <script src="assets/js/common.js?v=4"></script>
  <script src="assets/js/admin.js?v=4"></script>
</body>
</html>
