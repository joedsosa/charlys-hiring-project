<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    try { var t = localStorage.getItem('hireflow-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body data-page="admin" data-title="Admin dashboard">
  <main class="container">
    <div class="page-head">
      <h1>Admin dashboard</h1>
      <p>Every applicant is screened by AI as soon as they apply. Review the score and summary, then approve or decline.</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="overview" aria-selected="true">Overview</button>
      <button class="tab" role="tab" data-view="pipeline" aria-selected="false">Pipeline <span class="count" id="new-count">0</span></button>
    </div>

    <section id="view-overview"></section>

    <section id="view-pipeline" class="hidden">
      <div class="filters filters-2">
        <input type="search" id="k-search" placeholder="Search candidates" aria-label="Search candidates">
        <select id="k-position" aria-label="Position"><option value="">All positions</option></select>
      </div>
      <div class="kanban" id="kanban"></div>
      <p class="small muted">Tip: drag cards between columns on desktop, or open a candidate to move them.</p>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
