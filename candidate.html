<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidate portal</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    try { var t = localStorage.getItem('hireflow-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body data-page="candidate" data-title="Candidate portal">
  <main class="container">
    <div class="page-head">
      <h1>Find your next remote job</h1>
      <p>Every job here is 100% remote. Pick one you like, tell us a bit about yourself and record a short voice note. It takes about five minutes.</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="positions" aria-selected="true">Open positions</button>
      <button class="tab" role="tab" data-view="applications" aria-selected="false">My applications <span class="count" id="my-count">0</span></button>
    </div>

    <section id="view-positions">
      <div class="filters">
        <input type="search" id="f-search" placeholder="Search by title or skill" aria-label="Search positions">
        <select id="f-category" aria-label="Category"><option value="">All categories</option></select>
        <select id="f-location" aria-label="Region"><option value="">All regions</option></select>
        <select id="f-type" aria-label="Job type"><option value="">All types</option></select>
      </div>
      <p class="small muted" id="result-count"></p>
      <div class="grid grid-3" id="positions"></div>
    </section>

    <section id="view-apply" class="hidden"></section>

    <section id="view-applications" class="hidden">
      <div id="applications" class="stack"></div>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/candidate.js"></script>
</body>
</html>
